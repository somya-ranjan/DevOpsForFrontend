name: "First Workflow"
on: workflow_dispatch
jobs:
  first-job:
    runs on: ubuntu-latest
    steps:
      - name: "Hello World"
        run: echo "Hello, World"
      - name: "Print Current Date"
        run: date
  second-job:
    runs on: ubuntu-latest
    steps:
      - name: "List Files"
        run: ls -la
      - name: "Print Working Directory"
        run: pwd
