name: "Actions Workflow"
on:
  push:
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: "checkout"
        uses: actions/checkout@v3

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: "Install Dependencies"
        run: bun install

      - name: "Run Tests"
        run: bun run test

      - name: "Build Project"
        run: bun run build
