name: "#19/20- Deploy React to Vercel"

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    uses: ./.github/workflows/#16-run-react-test-cases.yml

  deploying-to-vercel:
    needs: run-tests
    runs-on: ubuntu-24.04

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: devops-for-frontend

      - name: Download React build
        uses: actions/download-artifact@v7
        with:
          name: react-app-build
          path: devops-for-frontend/dist

      - name: "Install Vercel CLI"
        run: npm install -g vercel

      # - name: "Deploy to Vercel"
      #   working-directory: devops-for-frontend
      #   run: vercel --prod --yes

      - name: "Uploading Build to Vercel and Deploying"
        working-directory: devops-for-frontend
        run: vercel deploy dist --prod --yes
