name: "#15- Run ESLint in React App"
on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - main

jobs:
  eslint-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: "Setup Node"
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: "Cache Bun dependencies"
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ubuntu-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ubuntu-bun-

      - name: "Install Dependencies"
        run: bun install

      - name: "Check ESLint"
        run: bun run lint

      - name: "Report ESLint issues in pull request"
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_level: warning
