#13 React App CI with GitHub Actions

name: "React App CI"
on:
  # push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkot Repository"
        uses: actions/checkout@v7

      - name: "Setup Node"
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: "Cache Bun dependencies"
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ubuntu-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ubuntu-bun-

      - name: "Install Dependencies"
        run: bun install

      - name: "build"
        run: bun run build
