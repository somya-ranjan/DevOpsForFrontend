name: Setup Bun dependencies
description: Set up Bun, restore its package cache, and install project dependencies.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    - name: Cache Bun dependencies
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ubuntu-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ubuntu-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
